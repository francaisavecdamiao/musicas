<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizador Áudio-Texto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Sincronização Áudio-Texto</h1>
        </header>

        <section class="upload-section">
            <div class="upload-card">
                <label for="audio-input" class="btn btn-secondary">
                    <span>🎵</span> Selecionar Áudio
                </label>
                <input type="file" id="audio-input" accept="audio/mp3, audio/wav" hidden>
                <span id="audio-filename" class="file-status">Nenhum áudio selecionado</span>
            </div>

            <div class="upload-card">
                <label for="text-input" class="btn btn-secondary">
                    <span>📄</span> Selecionar Texto (.txt)
                </label>
                <input type="file" id="text-input" accept=".txt" hidden>
                <span id="text-filename" class="file-status">Nenhum texto selecionado</span>
            </div>
        </section>

        <section class="phrase-display">
            <div id="prev-phrase" class="phrase phrase-secondary">Carregue os arquivos para começar</div>
            <div id="current-phrase" class="phrase phrase-active">
                <div class="phrase-card">Sincronizador de Áudio & Texto</div>
            </div>
            <div id="next-phrase" class="phrase phrase-secondary">Estilo Duolingo</div>
        </section>

        <section class="marking-section">
            <button id="mark-btn" class="btn btn-mark" disabled>
                📍 Marcar Tempo (Enter / M)
            </button>
        </section>

        <section class="controls-section">
            <div class="progress-container">
                <span id="current-time">00:00.000</span>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1" disabled>
                <span id="total-time">00:00.000</span>
            </div>

            <div class="audio-controls">
                <button id="play-btn" class="btn btn-primary" disabled>▶ Play</button>
                <button id="stop-btn" class="btn btn-danger" disabled>⏹ Stop</button>
                
                <div class="control-group">
                    <label for="volume-slider">🔊</label>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
                </div>

                <div class="control-group">
                    <label for="speed-select">⚡</label>
                    <select id="speed-select">
                        <option value="0.5">0.5x</option>
                        <option value="0.75">0.75x</option>
                        <option value="1" selected>1.0x</option>
                        <option value="1.25">1.25x</option>
                        <option value="1.5">1.5x</option>
                        <option value="2">2.0x</option>
                    </select>
                </div>
            </div>
        </section>

        <footer class="action-footer">
            <button id="export-btn" class="btn btn-success" disabled>
                📥 Exportar Temporização (Ctrl+E)
            </button>
        </footer>
    </div>

    <audio id="audio-player"></audio>
    <script src="js/script.js"></script>
</body>
</html>
