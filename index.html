<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizador Áudio-Texto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>🎵 Sincronizador Áudio-Texto</h1>
    </header>

    <section id="upload">
        <div class="upload-group">
            <label for="audioFile" class="upload-label">Selecionar Áudio (MP3/WAV)</label>
            <input type="file" id="audioFile" accept=".mp3,.wav,audio/*">
            <span id="audioName"></span>
        </div>
        <div class="upload-group">
            <label for="textFile" class="upload-label">Selecionar Texto (.txt)</label>
            <input type="file" id="textFile" accept=".txt">
        </div>
    </section>

    <section id="controls">
        <div class="controls-row">
            <button id="playBtn">▶ Play</button>
            <button id="stopBtn">⏹ Stop</button>
            <label>
                Velocidade:
                <input type="range" id="speedControl" min="0.5" max="2.0" step="0.1" value="1.0">
                <span id="speedValue">1.0x</span>
            </label>
            <label>
                Volume:
                <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="1.0">
            </label>
        </div>
        <div id="progressBar">
            <div id="progressFill"></div>
        </div>
    </section>

    <section id="mainContainer">
        <div id="fraseContainer">
            <div id="fraseAnterior" class="frase-secundaria"></div>
            <div id="fraseDestaque" class="frase-destaque">🎵</div>
            <div id="frasePosterior" class="frase-secundaria"></div>
        </div>
    </section>

    <section id="info">
        <span id="contador">Frase 0 de 0</span>
        <button id="destacarBtn">DESTACAR</button>
    </section>

    <footer>
        <p>Teclas: <strong>D</strong> = Próxima | <strong>←</strong> = Voltar | <strong>Espaço</strong> = Play/Pause</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
